<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>महिनावारी रु. ५,००० बचत हिसाब</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Stats Box */
        .stats { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { flex: 1; background: #3498db; color: white; padding: 15px; border-radius: 8px; text-align: center; min-width: 200px; }
        .card.green { background: #2ecc71; }
        .card.red { background: #e74c3c; }
        .card h3 { margin: 0; font-size: 16px; }
        .card p { margin: 5px 0 0 0; font-size: 22px; font-weight: bold; }

        /* Search Bar */
        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }

        /* Table Style */
        table { width: 100%; border-collapse: collapse; overflow-x: auto; display: block; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f1f1f1; }
        
        .status-paid { background: #2ecc71; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .status-unpaid { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>महिनावारी रु. ५,००० बचत तथा हिसाब-किताब</h2>

    <!-- Summary Box -->
    <div class="stats">
        <div class="card">
            <h3>कुल सदस्य</h3>
            <p id="total-members">०</p>
        </div>
        <div class="card green">
            <h3>जम्मा सङ्कलित रकम</h3>
            <p id="total-collected">रु. ०</p>
        </div>
        <div class="card red">
            <h3>जम्मा उठ्न बाँकी</h3>
            <p id="total-due">रु. ०</p>
        </div>
    </div>

    <!-- Search Box -->
    <input type="text" id="searchInput" class="search-box" onkeyup="searchMember()" placeholder="सदस्यको नाम खोज्नुहोस्...">

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th>क्र.सं.</th>
                <th>सदस्यको नाम</th>
                <th>वैशाख (५०००)</th>
                <th>जेठ (५०००)</th>
                <th>असार (५०००)</th>
                <th>जम्मा तिरेको</th>
                <th>बाँकी</th>
            </tr>
        </thead>
        <tbody id="member-table">
            <!-- JavaScript ले डाटा यहाँ हाल्छ -->
        </tbody>
    </table>
</div>

<script>
    // नमुना डाटा (यसलाई पछि Google Sheet सँग जोडिनेछ)
    const members = [
        { id: 1, name: "राम श्रेष्ठ", baishakh: "Paid", jeth: "Paid", ashar: "Unpaid" },
        { id: 2, name: "श्याम शर्मा", baishakh: "Paid", jeth: "Paid", ashar: "Paid" },
        { id: 3, name: "हरि गुरुङ", baishakh: "Paid", jeth: "Unpaid", ashar: "Unpaid" },
        { id: 4, name: "सीता थापा", baishakh: "Unpaid", jeth: "Unpaid", ashar: "Unpaid" }
    ];

    const monthlyAmount = 5000;
    const totalMonths = 3; // वैशाख, जेठ, असार (३ महिना)

    function renderTable() {
        const tbody = document.getElementById("member-table");
        tbody.innerHTML = "";

        let grandTotalCollected = 0;
        let grandTotalDue = 0;

        members.forEach((m, index) => {
            // कसले कति महिना तिर्यो حساب गर्ने
            let paidMonths = 0;
            if (m.baishakh === "Paid") paidMonths++;
            if (m.jeth === "Paid") paidMonths++;
            if (m.ashar === "Paid") paidMonths++;

            let totalPaid = paidMonths * monthlyAmount;
            let totalDue = (totalMonths - paidMonths) * monthlyAmount;

            grandTotalCollected += totalPaid;
            grandTotalDue += totalDue;

            let row = `<tr>
                <td>${index + 1}</td>
                <td><strong>${m.name}</strong></td>
                <td><span class="${m.baishakh === 'Paid' ? 'status-paid' : 'status-unpaid'}">${m.baishakh}</span></td>
                <td><span class="${m.jeth === 'Paid' ? 'status-paid' : 'status-unpaid'}">${m.jeth}</span></td>
                <td><span class="${m.ashar === 'Paid' ? 'status-paid' : 'status-unpaid'}">${m.ashar}</span></td>
                <td style="color: green; font-weight: bold;">रु. ${totalPaid.toLocaleString()}</td>
                <td style="color: red; font-weight: bold;">रु. ${totalDue.toLocaleString()}</td>
            </tr>`;

            tbody.innerHTML += row;
        });

        // Dashboard Summary Update
        document.getElementById("total-members").innerText = members.length;
        document.getElementById("total-collected").innerText = "रु. " + grandTotalCollected.toLocaleString();
        document.getElementById("total-due").innerText = "रु. " + grandTotalDue.toLocaleString();
    }

    // Search Feature
    function searchMember() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let rows = document.querySelectorAll("#member-table tr");

        rows.forEach(row => {
            let name = row.children[1].innerText.toLowerCase();
            if (name.includes(input)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }

    // Run when loaded
    renderTable();
</script>

</body>
</html>
