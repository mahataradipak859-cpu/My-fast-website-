<!-- SAVING -->
<div class="card">
  <h2>💰 Saving Record</h2>

  <div class="controls">
    <label>Select Year:</label>
    <select id="savingYear" class="year-select" onchange="renderSaving()"></select>
  </div>

  <div class="table-wrap">
    <table id="savingTable"></table>
  </div>

  <div class="summary">
    <div class="summary-box">
      Expected
      <strong id="savingExpected">Rs. 0</strong>
    </div>

    <div class="summary-box">
      Collected
      <strong id="savingCollected">Rs. 0</strong>
    </div>

    <div class="summary-box">
      Unpaid
      <strong id="savingUnpaid">0</strong>
    </div>

    <div class="summary-box">
      Fine
      <strong id="savingFine">Rs. 0</strong>
    </div>
  </div>
</div>


<!-- INVESTMENT -->
<div class="card">
  <h2>📈 Investment Record</h2>

  <div class="info-grid">

    <div class="info">
      <b>SIP Start Date</b>
      <input type="date" id="sipStart"
             onchange="saveSettings(); renderSip();">
    </div>

    <div class="info">
      <b>SIP Monthly Amount</b>
      <input type="number" id="sipAmount"
             onchange="saveSettings(); renderSip();">
    </div>

    <div class="info">
      <b>Market Start Date</b>
      <input type="date" id="marketStart"
             onchange="saveSettings(); renderMarket();">
    </div>

    <div class="info">
      <b>Market Monthly Amount</b>
      <input type="number" id="marketAmount"
             onchange="saveSettings(); renderMarket();">
    </div>

  </div>

  <br>

  <div class="controls">
    <label>Select Year:</label>
    <select id="sipYear"
            class="year-select"
            onchange="renderSip()"></select>
  </div>

  <h3>SIP — 12 Months</h3>

  <div class="table-wrap">
    <table id="sipTable"></table>
  </div>

  <br>

  <div class="controls">
    <label>Select Year:</label>
    <select id="marketYear"
            class="year-select"
            onchange="renderMarket()"></select>
  </div>

  <h3>Market — 12 Months</h3>

  <div class="table-wrap">
    <table id="marketTable"></table>
  </div>
</div>
