<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>महिनावारी रु. ५,००० अटोमेटिक हिसाब</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        .stats { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { flex: 1; background: #3498db; color: white; padding: 15px; border-radius: 8px; text-align: center; min-width: 200px; }
        .card.green { background: #2ecc71; }
        .card.red { background: #e74c3c; }
        .card h3 { margin: 0; font-size: 16px; }
        .card p { margin: 5px 0 0 0; font-size: 22px; font-weight: bold; }

        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f1f1f1; }
        
        .amount-paid { color: #27ae60; font-weight: bold; }
        .amount-zero { color: #e74c3c; font-weight: bold; }
        .loading { text-align: center; font-weight: bold; padding: 20px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>महिनावारी रु. ५,००० बचत तथा अटोमेटिक हिसाब</h2>

    <div class="stats">
        <div class="card">
            <h3>कुल सदस्य</h3>
            <p id="total-members">०</p>
        </div>
        <div class="card green">
            <h3>जम्मा सङ्कलित रकम</h3>
            <p id="total-collected">रु. ०</p>
        </div>
        <div class="card red">
            <h3>जम्मा उठ्न बाँकी</h3>
            <p id="total-due">रु. ०</p>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" onkeyup="searchMember()" placeholder="सदस्यको नाम खोज्नुहोस्...">

    <table>
        <thead>
            <tr>
                <th>क्र.सं.</th>
                <th>सदस्यको नाम</th>
                <th>वैशाख</th>
                <th>जेठ</th>
                <th>असार</th>
                <th>जम्मा तिरेको</th>
                <th>बाँकी रकम</th>
            </tr>
        </thead>
        <tbody id="member-table">
            <tr><td colspan="7" class="loading">डाटा लोड हुँदैछ, कृपया पर्खनुहोस्...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // यहाँ आफ्नो Google Apps Script को URL पेस्ट गर्नुहोस्
    const apiURL = "YOUR_APPS_SCRIPT_URL_HERE";

    // ३ महिनाको प्रति महिना रु. ५,००० को हिसाबले जम्मा हुनुपर्ने रकम = १५,०००
    const totalTargetPerMember = 15000; 

    async function fetchData() {
        try {
            const response = await fetch(apiURL);
            const members = await response.json();
            renderTable(members);
        } catch (error) {
            document.getElementById("member-table").innerHTML = `<tr><td colspan="7" style="color:red;">डाटा लोड हुन सकेन! कृपया Google Sheet को Web App URL जाँच गर्नुहोस्।</td></tr>`;
        }
    }

    function renderTable(members) {
        const tbody = document.getElementById("member-table");
        tbody.innerHTML = "";

        let grandTotalCollected = 0;
        let grandTotalDue = 0;

        members.forEach((m, index) => {
            // अङ्कमा नभए 0 मान्ने (Auto Parse Number)
            let bAmount = parseFloat(m.baishakh) || 0;
            let jAmount = parseFloat(m.jeth) || 0;
            let aAmount = parseFloat(m.ashar) || 0;

            // अटोमेटिक जोड (Sum Calculation)
            let totalPaid = bAmount + jAmount + aAmount;
            let totalDue = totalTargetPerMember - totalPaid;

            if (totalDue < 0) totalDue = 0; // यदि बढी तिरेको छ भने बाँकी 0 देखाउने

            grandTotalCollected += totalPaid;
            grandTotalDue += totalDue;

            let row = `<tr>
                <td>${index + 1}</td>
                <td><strong>${m.name}</strong></td>
                <td class="${bAmount > 0 ? 'amount-paid' : 'amount-zero'}">रु. ${bAmount.toLocaleString()}</td>
                <td class="${jAmount > 0 ? 'amount-paid' : 'amount-zero'}">रु. ${jAmount.toLocaleString()}</td>
                <td class="${aAmount > 0 ? 'amount-paid' : 'amount-zero'}">रु. ${aAmount.toLocaleString()}</td>
                <td style="color: green; font-weight: bold;">रु. ${totalPaid.toLocaleString()}</td>
                <td style="color: red; font-weight: bold;">रु. ${totalDue.toLocaleString()}</td>
            </tr>`;

            tbody.innerHTML += row;
        });

        // Dashboard/Summary Update
        document.getElementById("total-members").innerText = members.length;
        document.getElementById("total-collected").innerText = "रु. " + grandTotalCollected.toLocaleString();
        document.getElementById("total-due").innerText = "रु. " + grandTotalDue.toLocaleString();
    }

    function searchMember() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let rows = document.querySelectorAll("#member-table tr");

        rows.forEach(row => {
            let name = row.children[1] ? row.children[1].innerText.toLowerCase() : "";
            if (name.includes(input)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }

    fetchData();
</script>

</body>
</html>
